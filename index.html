<style>
:root{--ink:#4A4E58;--dark:#242830;--yellow:#FBF2A3;--bg:#EEEDEA;--card:#fff;--line:#D9D6D0;--soft:#F3F2F0;--muted:#777B84;--good:#27794a;--goodbg:#e7f5ec;--warn:#9a6900;--warnbg:#fff4d7;--red:#a62b2b;--redbg:#fde8e8;--blue:#315f9e;--bluebg:#eaf1fb;--shadow:0 8px 24px rgba(36,40,48,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",Arial,Helvetica,sans-serif;font-size:13px}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#4A4E58,#252a31)}.login-card{width:min(410px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}.logo{font-size:38px}.login h1{margin:10px 0 5px;font-size:24px}.login p{color:var(--muted);line-height:1.5}.login input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;margin:12px 0}.primary{background:var(--ink);color:#fff;border:0}.yellow{background:var(--yellow);color:var(--ink);border:1px solid #e5dc86}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px;font-weight:700}.btn:hover{filter:brightness(.98)}.login .btn{width:100%;padding:11px}.err{color:var(--red);background:var(--redbg);padding:9px;border-radius:8px;font-size:12px;text-align:left}
.app{display:none;min-height:100vh}.layout{display:flex;min-height:100vh}.side{width:218px;background:#242830;color:#fff;padding:20px 14px;flex:none}.brand{padding:8px 10px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:18px}.brand b{font-size:16px}.brand span{display:block;color:#FBF2A3;font-weight:800;font-size:12px;margin-top:3px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#ddd;padding:12px 12px;border-radius:8px;margin:3px 0;font-weight:700}.nav button.active,.nav button:hover{background:#FBF2A3;color:#242830}.side-foot{position:fixed;bottom:18px;width:190px;color:#aeb1b7;font-size:11px;line-height:1.6}.side-foot i{color:#64bf78}.main{flex:1;min-width:0;padding:26px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:26px;color:#242830}.top p{margin:5px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center}.last{font-size:11px;color:var(--muted);text-align:right}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}.kpi .icon{float:left;width:35px;height:35px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:18px;margin-right:10px}.kpi .n{font-size:23px;font-weight:800;color:#17191d}.kpi .l{clear:both;padding-top:8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.tabs{display:flex;gap:5px;margin:8px 0 14px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;padding:11px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}.tab.active{color:var(--ink);border-bottom-color:#FBF2A3}.toolbar{background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:170px}.field.search{flex:1;min-width:240px}.field label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}.field input,.field select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 10px;outline:none}.count{margin-left:auto;color:var(--muted);font-size:11px;padding-bottom:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}.card-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}.card-head h2{font-size:14px;margin:0;color:#222}.card-head span{font-size:11px;color:var(--muted)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th{background:#050505;color:#fff;text-align:left;font-size:10px;padding:11px 9px;font-weight:700}.table td{padding:10px 9px;border-bottom:1px solid #ecebea;font-size:11.5px;vertical-align:middle}.table tbody tr:nth-child(even){background:#e9edf2}.table tbody tr:hover{background:#dfe4ea}.table td strong{color:#222}.mono{font-family:Consolas,monospace}.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:800;background:#eee}.ok{background:var(--goodbg);color:var(--good)}.warn{background:var(--warnbg);color:var(--warn)}.red{background:var(--redbg);color:var(--red)}.blue{background:var(--bluebg);color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart{padding:15px}.barrow{display:grid;grid-template-columns:145px 1fr 45px;gap:8px;align-items:center;margin:10px 0}.barlabel{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bartrack{height:16px;background:#eee;border-radius:4px;overflow:hidden}.barfill{height:100%;background:#4A4E58}.barvalue{text-align:right;font-weight:800;font-size:11px}.donutline{display:flex;gap:15px;align-items:center;padding:10px 0}.donut{width:105px;height:105px;border-radius:50%;background:conic-gradient(#4A4E58 0 70%,#FBF2A3 70% 90%,#bfc2c7 90%);display:grid;place-items:center}.donut:after{content:"";width:62px;height:62px;background:#fff;border-radius:50%}.legend{display:grid;gap:8px}.legend div{font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4A4E58;margin-right:6px}.note{padding:14px;color:var(--muted);text-align:center}.store-select{min-width:300px}.detail{padding:16px}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}.detail-title{font-size:20px;font-weight:800;color:#222}.detail-sub{color:var(--muted);margin-top:4px}.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini{background:var(--soft);border-radius:8px;padding:10px}.mini span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.mini b{font-size:16px;color:#222}.day-card{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.day-head{background:#050505;color:#fff;padding:9px;font-weight:800}.day-table{width:100%;border-collapse:collapse}.day-table th,.day-table td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:10.5px}.day-table tr:nth-child(even){background:#eef1f4}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:20px}.modal{background:#fff;width:min(1180px,100%);max-height:90vh;overflow:auto;border-radius:14px}.modal-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:16px}.close{border:0;background:transparent;font-size:20px}.loading{padding:45px;text-align:center;color:var(--muted)}

.analytics-toolbar{display:grid;grid-template-columns:minmax(230px,1fr) minmax(230px,1fr) auto;gap:10px;align-items:end}
.analytics-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:12px 0 14px}
.analytics-kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);min-height:84px}
.analytics-kpi .ak-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.analytics-kpi .ak-value{font-size:22px;font-weight:800;color:#17191d;margin-top:5px}
.analytics-kpi .ak-sub{font-size:10px;color:var(--muted);margin-top:2px}
.chart-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.chart-box{padding:15px}
.chart-title{font-size:14px;font-weight:800;color:#222;margin-bottom:3px}
.chart-sub{font-size:10px;color:var(--muted);margin-bottom:12px}
.stack-row{display:grid;grid-template-columns:90px 1fr 55px;gap:8px;align-items:center;margin:9px 0}
.stack-label{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack-track{height:18px;border-radius:5px;background:#eef0f2;display:flex;overflow:hidden}
.stack-before{background:#f1c75b}.stack-inside{background:#4A4E58}.stack-after{background:#d87a68}
.stack-total{text-align:right;font-size:10.5px;font-weight:800}
.chart-legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:10px;color:var(--muted)}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend-before{background:#f1c75b}.legend-inside{background:#4A4E58}.legend-after{background:#d87a68}
.vbars{height:205px;display:flex;align-items:flex-end;gap:7px;padding:8px 2px 0;border-bottom:1px solid var(--line)}
.vbar-col{flex:1;min-width:25px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.vbar-stack{width:min(34px,75%);min-height:2px;border-radius:5px 5px 0 0;overflow:hidden;display:flex;flex-direction:column-reverse}
.vbar-before{background:#f1c75b}.vbar-inside{background:#4A4E58}.vbar-after{background:#d87a68}
.vbar-value{font-size:9px;font-weight:800}.vbar-label{font-size:9px;color:var(--muted);white-space:nowrap}
.progress-row{display:grid;grid-template-columns:145px 1fr 45px;gap:8px;align-items:center;margin:11px 0}
.progress-track{height:12px;background:#eef0f2;border-radius:6px;overflow:hidden}.progress-fill{height:100%;background:#4A4E58;border-radius:6px}
.analytics-table{width:100%;border-collapse:collapse;min-width:850px}
.analytics-table th{background:#050505;color:#fff;text-align:left;font-size:10px;padding:10px 8px}
.analytics-table td{padding:9px 8px;border-bottom:1px solid #ecebea;font-size:10.5px}
.analytics-table tbody tr:nth-child(even){background:#f4f5f6}
.analytics-table tbody tr:hover{background:#e9edf2}
.good-text{color:var(--good);font-weight:800}.warn-text{color:var(--warn);font-weight:800}.red-text{color:var(--red);font-weight:800}
.empty-analytics{padding:35px 15px;text-align:center;color:var(--muted)}
.filter-hint{font-size:10px;color:var(--muted);margin:7px 0 0}
.metric-pill{display:inline-block;padding:4px 7px;border-radius:10px;background:var(--soft);font-size:10px;font-weight:700;margin:2px}
.print-status{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.1px}.print-status.yes{background:#e8f6ee;color:#147a42;border:1px solid #b9e4ca}.print-status.no{background:#fff4e5;color:#a45a00;border:1px solid #f0d19f}.print-status small{font-size:9px;font-weight:500;opacity:.82}.print-status .ps-dot{width:7px;height:7px;border-radius:50%;display:inline-block}.print-status.yes .ps-dot{background:#20a35a}.print-status.no .ps-dot{background:#e39a32}

@media(max-width:1200px){.analytics-kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.analytics-toolbar,.chart-grid{grid-template-columns:1fr}.analytics-kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.side{width:185px}.side-foot{width:155px}}@media(max-width:800px){.layout{display:block}.side{width:100%;padding:10px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.side-foot{display:none}.main{padding:15px}.kpis,.grid2,.mini-grid{grid-template-columns:1fr 1fr}.top{flex-direction:column}.top-actions{width:100%;justify-content:flex-end}}

/* ===== COBERTURA REGIONAL ===== */
.coverage-hero{background:linear-gradient(135deg,#242830 0%,#313743 65%,#3c4655 100%);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.coverage-hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-90px;background:rgba(251,242,163,.13)}
.coverage-hero h2{margin:0 0 5px;font-size:21px}.coverage-hero p{margin:0;color:#d6d9df;font-size:12px;max-width:850px;line-height:1.5}
.coverage-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 14px}
.coverage-kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.coverage-kpi .ck-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.coverage-kpi .ck-value{font-size:24px;font-weight:800;color:#17191d;margin-top:4px}.coverage-kpi .ck-sub{font-size:10px;color:var(--muted);margin-top:2px}
.coverage-toolbar{display:grid;grid-template-columns:1fr 180px 180px auto;gap:10px;align-items:end}
.coverage-toolbar .field:first-child{min-width:260px}.coverage-actions{display:flex;gap:7px;align-items:end}
.coverage-summary{width:100%;border-collapse:collapse;min-width:850px}
.coverage-summary th{background:#050505;color:#fff;text-align:left;font-size:10px;padding:11px 10px}
.coverage-summary td{padding:11px 10px;border-bottom:1px solid #ecebea;font-size:11px}
.coverage-summary tbody tr.regional-row{cursor:pointer;transition:.15s}
.coverage-summary tbody tr.regional-row:hover{background:#f4f5f6}
.coverage-summary tbody tr.regional-row.open{background:#fff8cc}
.coverage-summary .arrow{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#f0f1f2;margin-right:7px;font-weight:900}
.coverage-summary .regional-name{font-weight:800;color:#222}.coverage-summary .num{font-weight:800}.coverage-summary .pending{color:var(--red);font-weight:800}.coverage-summary .responded{color:var(--good);font-weight:800}
.coverage-summary .rate{font-weight:800}.rate.high{color:var(--good)}.rate.mid{color:var(--warn)}.rate.low{color:var(--red)}
.coverage-detail-row td{padding:0!important;background:#fafafa}
.coverage-detail{padding:12px 14px 14px 44px;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5}
.coverage-detail-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.coverage-detail-head strong{color:#222;font-size:12px}.coverage-detail-head span{font-size:10px;color:var(--muted)}
.store-mini-table{width:100%;border-collapse:collapse;min-width:760px}
.store-mini-table th{background:#242830;color:#fff;font-size:9px;text-align:left;padding:8px}
.store-mini-table td{font-size:10.5px;padding:8px;border-bottom:1px solid #e6e6e6}
.store-mini-table tr:nth-child(even){background:#fff}
.response-badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:800}
.response-badge.yes{background:var(--goodbg);color:var(--good)}.response-badge.no{background:var(--redbg);color:var(--red)}
.bit{font-family:Consolas,monospace;font-weight:900;font-size:12px}
.action-text{font-size:10px;font-weight:700}.action-text.ok{color:var(--good)}.action-text.alert{color:var(--red)}
.coverage-note{padding:10px 14px;color:var(--muted);font-size:10px;background:#f8f8f7;border-top:1px solid var(--line)}
.date-slicer{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:12px;box-shadow:var(--shadow)}
.date-slicer-title{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-right:4px;padding-bottom:10px;white-space:nowrap}
.date-range-field{display:flex;flex-direction:column;gap:5px;min-width:180px}.date-range-field label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}.date-range-field input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;outline:none;height:38px}.date-range-field input:focus{border-color:#4A4E58;box-shadow:0 0 0 2px rgba(74,78,88,.08)}
.date-range-separator{font-size:11px;color:var(--muted);font-weight:700;padding:0 2px 10px}.date-slicer .date-clear{margin-left:auto}
.logo-img{display:block;object-fit:contain;object-position:left center}.login-logo{width:245px;height:76px;margin:0 auto 5px}.brand-logo{width:178px;height:54px;margin:0 0 7px;border-radius:4px}.brand-logo-wrap{padding:0 0 12px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
@media(max-width:1200px){.coverage-kpis{grid-template-columns:repeat(3,1fr)}.coverage-toolbar{grid-template-columns:1fr 1fr}.coverage-actions{grid-column:1/-1}}
@media(max-width:800px){.coverage-kpis{grid-template-columns:1fr 1fr}.coverage-toolbar{grid-template-columns:1fr}.coverage-actions{grid-column:auto}}

/* ===== AJUSTES PROFISSIONAIS ===== */
.side{transition:margin-left .22s ease,transform .22s ease}
.layout.sidebar-closed .side{margin-left:-218px}
.top-left{display:flex;align-items:flex-start;gap:10px}
.side-toggle{width:34px;height:34px;border:1px solid var(--line);background:#fff;color:#242830;border-radius:9px;font-size:21px;line-height:1;font-weight:900;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
.side-toggle:hover{background:#f2f3f4}
.login-logo{width:205px;height:auto;aspect-ratio:1988/386;object-fit:contain;margin:0 auto 8px}
.brand-logo{width:154px;height:auto;aspect-ratio:1988/386;object-fit:contain;margin:0 0 9px;border-radius:3px}
.brand-logo-wrap{display:flex;flex-direction:column;align-items:flex-start}
.coverage-summary th[data-sort]{cursor:pointer;user-select:none;white-space:nowrap}
.coverage-summary th[data-sort]:hover{background:#1b1b1b}
.sort-indicator{opacity:.65;font-size:9px;margin-left:4px}
.coverage-summary tbody tr.regional-row td{position:relative}
.coverage-detail .store-mini-table th[data-store-sort]{cursor:pointer;white-space:nowrap}
.coverage-detail .store-mini-table th[data-store-sort]:hover{background:#30353d}
.days-pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2f6;color:#3b4653;font-size:9px;font-weight:800;white-space:nowrap}
.days-empty{color:#9a9da3}.drill-btn{border:1px solid var(--line);background:#fff;color:#242830;border-radius:8px;padding:7px 10px;font-weight:800;font-size:10px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}.drill-btn:hover{background:#f2f3f4}.drill-btn.active{background:#242830;color:#fff;border-color:#242830}.drill-arrow{font-size:14px;line-height:1}.drill-breadcrumb{display:inline-flex;align-items:center;gap:6px;margin-right:10px;font-size:10px;color:var(--muted)}.drill-breadcrumb b{color:#242830}.drill-summary{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.level-help{font-size:10px;color:var(--muted);margin-left:8px}
@media(max-width:800px){
  .layout.sidebar-closed .side{margin-left:0;transform:translateX(-100%)}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;height:100vh;overflow:auto}
  .top-left{width:100%}
  .side-toggle{position:relative;z-index:1}
}
.coverage-total-row{font-weight:800;background:#f1f2f4;border-top:2px solid #242830}.coverage-total-row td{font-weight:800}.coverage-total-row .responded{color:#27794a}.coverage-total-row .pending{color:#a62b2b}

  .timeline-cell{font-weight:800;text-align:center;white-space:nowrap}
  .timeline-cell.draft{color:#9a6900}.timeline-cell.done{color:#27794a}.timeline-cell.print{color:#315f9e}
  .participation-cell{font-weight:900;white-space:nowrap}
  .participation-cell.high{color:#27794a}.participation-cell.mid{color:#9a6900}.participation-cell.low{color:#a62b2b}
  .timeline-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--muted)}
  .timeline-legend span{display:inline-flex;align-items:center;gap:5px}
  .timeline-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .timeline-dot.draft{background:#f1c75b}.timeline-dot.done{background:#4A4E58}.timeline-dot.print{background:#315f9e}
  .status-flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .status-flow .step{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800}
  .status-flow .step.off{background:#f1f2f4;color:#a5a8ad}
  .status-flow .step.on.draft{background:#fff4d7;color:#9a6900}
  .status-flow .step.on.done{background:#e7f5ec;color:#27794a}
  .status-flow .step.on.print{background:#eaf1fb;color:#315f9e}
  .status-arrow{color:#b0b3b8;font-size:10px}
  .dynamic-report{margin-top:14px}.dynamic-toolbar{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}.dynamic-toolbar .field{min-width:180px}.dynamic-help{font-size:10px;color:var(--muted);margin-top:8px}.dynamic-table{width:100%;border-collapse:collapse;min-width:760px}.dynamic-table th{background:#050505;color:#fff;font-size:10px;text-align:center;padding:10px 8px;position:sticky;top:0;z-index:1}.dynamic-table th:first-child{text-align:left}.dynamic-table td{padding:9px 8px;border-bottom:1px solid #ecebea;font-size:10.5px;text-align:center}.dynamic-table td:first-child{text-align:left;font-weight:800;color:#222}.dynamic-table tbody tr:nth-child(even){background:#f4f5f6}.dynamic-table tbody tr:hover{background:#e9edf2}.matrix-cell{font-weight:900}.matrix-cell.yes{color:var(--good)}.matrix-cell.no{color:#9da1a8}.matrix-total{background:#f1f2f4!important;font-weight:900;border-top:2px solid #242830}.dynamic-empty{padding:28px;text-align:center;color:var(--muted)}
  .regional-line-chart{padding:16px}.regional-chart-wrap{width:100%;overflow-x:auto}.regional-chart-svg{display:block;width:100%;min-width:760px;height:390px}.regional-chart-legend{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--muted)}.regional-chart-legend span{display:inline-flex;align-items:center;gap:6px}.regional-chart-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}.regional-chart-note{font-size:10px;color:var(--muted);margin-top:8px}.regional-chart-empty{padding:38px;text-align:center;color:var(--muted)}
  @media(max-width:900px){.dynamic-toolbar{grid-template-columns:1fr 1fr}.dynamic-toolbar .dynamic-actions{grid-column:1/-1}}
  /* ============================================================
   FUNDO ANIMADO — REDE DE PARTÍCULAS INTERATIVA
   ============================================================ */
/* Partículas: somente como detalhe visual, sem alterar as cores do HTML */
#particleCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;display:none;opacity:1}
#login,#app{position:relative;z-index:2}
#login{overflow:hidden}
#app{overflow:hidden}
body:not(.dashboard-active) #particleCanvas{display:block;z-index:3}
body.dashboard-active #particleCanvas{display:block}
#login .login-card{position:relative;z-index:3}
@media (prefers-reduced-motion:reduce){#particleCanvas{opacity:.65}}

</style>

function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function payload(log){let p=log&&log.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p={}}}return p||{}}
function state(log){let d=payload(log).dados;if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){d={}}}return d||{}}

function settings(log){return state(log).settings||{}}

function storeKey(log){let p=payload(log);return p.lojaKey||log.loja_key||storeName(log)}
function saved(log){let p=payload(log);return p.salvoEm||log.created_at||''}
function date(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('pt-BR')}
function dateOnly(v){if(!v)return '—';const d=new Date(v+'T00:00:00');return isNaN(d)?String(v):d.toLocaleDateString('pt-BR')}
function mins(v){v=Number(v)||0;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function week(log){return payload(log).semanaInicio||settings(log).semanaInicio||''}
function status(log){return String(payload(log).status||settings(log).statusEscala||'rascunho').toLowerCase()}

function dayKey(log){const v=log&&log.created_at||saved(log)||'';const m=String(v).match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:''}
function printInfo(log){
  const key=storeKey(log), wk=week(log), day=dayKey(log);
  const found=logs.filter(x=>storeKey(x)===key && week(x)===wk && dayKey(x)===day && triggerOf(x)==='impressao')
    .sort((a,b)=>new Date(b.created_at||saved(b))-new Date(a.created_at||saved(a)));
  return {printed:found.length>0, log:found[0]||null};
}
function weekPrintInfo(log){
  const key=storeKey(log), wk=week(log);
  const found=logs.filter(x=>storeKey(x)===key && week(x)===wk && triggerOf(x)==='impressao')
    .sort((a,b)=>new Date(b.created_at||saved(b))-new Date(a.created_at||saved(a)));
  return {printed:found.length>0, log:found[0]||null};
}
function hasFullWeekSchedule(log){
  if(!log)return false;
  const sched=schedule(log)||{};
  // Para CONCLUÍDO, a loja precisa ter escala de segunda a sábado.
  // Domingo não participa da regra de conclusão.
  const requiredDays=['SEGUNDA-FEIRA','TERÇA-FEIRA','QUARTA-FEIRA','QUINTA-FEIRA','SEXTA-FEIRA','SÁBADO'];
  return requiredDays.every(d=>Object.values(sched[d]||{}).some(en=>en && en.escalar==='SIM'));
}
function isScaleConcluded(log){
  return !!log && hasFullWeekSchedule(log) && weekPrintInfo(log).printed;
}
function scaleStatus(log){
  if(isScaleConcluded(log))return 'Concluído';
  if(log)return 'Rascunho';
  return 'Não concluído';
}
function printBadge(log){
  const p=printInfo(log);
  if(p.printed) return '<div class="print-status yes"><span class="ps-dot"></span>🖨 Impresso <small>em '+esc(date(p.log.created_at||saved(p.log)))+'</small></div>';

}
function scaleCount(log){let n=0,s=schedule(log);DAYS.forEach(d=>Object.values(s[d]||{}).forEach(x=>{if(x&&x.escalar==='SIM')n++}));return n}

function situation(e){if(e.ferias)return ['Férias','warn'];if(e.ausente)return ['Ausente','red'];return [e.situacao||'Ativo','ok']}
async function fetchLogs(){let out=[],offset=0,page=500;while(true){const u=URL+'/rest/v1/escala_logs?select=id,created_at,loja_key,trigger,payload&order=created_at.desc&limit='+page+'&offset='+offset;const r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('HTTP '+r.status+' — '+await r.text());const rows=await r.json();out=out.concat(rows);if(rows.length<page||offset>=10000)break;offset+=page}return out}
async function load(){ $('content').innerHTML='<div class="card"><div class="loading">⏳ Carregando dados do Supabase...</div></div>';try{logs=await fetchLogs();latest={};logs.forEach(l=>{const k=storeKey(l);if(!latest[k])latest[k]=l});loadedAt=new Date();$('lastUpdate').innerHTML='Última atualização:<br><b>'+date(loadedAt)+'</b>';render()}catch(e){$('content').innerHTML='<div class="card"><div class="loading">⚠️ Não foi possível carregar os dados.<br><small>'+esc(e.message)+'</small></div></div>'}}

function departments(){const m={};allEmployees().forEach(x=>{const d=x.e.depto||'Sem departamento';m[d]=(m[d]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function kpis(){const ss=stores(), es=allEmployees(), fin=ss.filter(l=>status(l)==='finalizada').length;return '<div class="kpi"><div class="icon">🏬</div><div class="n">'+ss.length+'</div><div class="l">Lojas com dados</div></div><div class="kpi"><div class="icon">👥</div><div class="n">'+es.length+'</div><div class="l">Colaboradores</div></div><div class="kpi"><div class="icon">✓</div><div class="n">'+fin+'</div><div class="l">Escalas finalizadas</div></div><div class="kpi"><div class="icon">▣</div><div class="n">'+logs.length+'</div><div class="l">Snapshots salvos</div></div><div class="kpi"><div class="icon">◷</div><div class="n">'+(logs.length?date(saved(logs[0])).split(',')[1]||'—':'—')+'</div><div class="l">Último salvamento</div></div>'}

function timeToMin(v){
  const m=String(v||'').match(/^(\d{1,2}):(\d{2})$/);
  if(!m)return null;
  return Number(m[1])*60+Number(m[2]);
}
function fmtHours(v){
  v=Math.max(0,Number(v)||0);
  const h=Math.floor(v/60), m=Math.round(v%60);
  if(m===60)return String(h+1).padStart(2,'0')+':00';
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function pct(v,total){
  return total?Math.round(v/total*1000)/10:0;
}
function weekKey(log){
  return String(week(log)||'').trim()||'Sem semana';
}
function historical(){
  const map={};
  logs.forEach(l=>{
    const k=storeKey(l)+'||'+weekKey(l);
    if(!map[k] || new Date(saved(l)||0)>new Date(saved(map[k])||0))map[k]=l;
  });
  return Object.values(map);
}
function analyticsWeeks(){
  const set=new Set(historical().map(weekKey));
  return Array.from(set).sort((a,b)=>{
    if(a==='Sem semana')return 1;if(b==='Sem semana')return -1;
    return new Date(a)-new Date(b);
  });
}
function analyticsStoreList(){
  const m={};
  historical().forEach(l=>m[storeKey(l)]={key:storeKey(l),name:storeName(l)});
  return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
}
function dayStats(log,day){
  const st=settings(log), sched=schedule(log), open=timeToMin(st.horaAbertura), close=timeToMin(st.horaFechamento);
  let before=0,inside=0,after=0,scheduled=0,employeesN=0;
  const entries=sched[day]||{};
  Object.keys(entries).forEach(id=>{
    const en=entries[id];
    if(!en || en.escalar!=='SIM')return;
    const start=timeToMin(en.inicioExp), end=timeToMin(en.fimExp);
    if(start==null || end==null || end<=start)return;
    scheduled++;
    employeesN++;
    let intervals=[[start,end]];
    const lunchStart=timeToMin(en.inicioAlm), lunchEnd=timeToMin(en.fimAlm);
    if(lunchStart!=null && lunchEnd!=null && lunchEnd>lunchStart){
      intervals=[];
      if(start<lunchStart)intervals.push([start,Math.min(end,lunchStart)]);
      if(end>lunchEnd)intervals.push([Math.max(start,lunchEnd),end]);
    }
    intervals.forEach(([a,b])=>{
      const duration=Math.max(0,b-a);
      if(open==null || close==null || close<=open){inside+=duration;return;}
      const iStart=Math.max(a,open), iEnd=Math.min(b,close);
      inside+=Math.max(0,iEnd-iStart);
      before+=Math.max(0,Math.min(b,open)-a);
      after+=Math.max(0,b-Math.max(a,close));
    });
  });
  return {before,inside,after,total:before+inside+after,scheduled,employeesN};
}
function logAnalytics(log){
  const days=DAYS.map(d=>dayStats(log,d));
  return days.reduce((a,x)=>({
    before:a.before+x.before,inside:a.inside+x.inside,after:a.after+x.after,total:a.total+x.total,
    scheduled:a.scheduled+x.scheduled,employeesN:a.employeesN+x.employeesN
  }),{before:0,inside:0,after:0,total:0,scheduled:0,employeesN:0});
}

function analyticsStoreRows(logsForView){

    if(!map[k])map[k]={key:k,name:storeName(l),before:0,inside:0,after:0,total:0,scheduled:0};
    Object.assign(map[k],{
      before:map[k].before+a.before,inside:map[k].inside+a.inside,after:map[k].after+a.after,
      total:map[k].total+a.total,scheduled:map[k].scheduled+a.scheduled

  });
  return Object.values(map).sort((a,b)=>(b.total?b.after/b.total:0)-(a.total?a.after/a.total:0));

  function normText(v){
    return String(v==null?'':v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
  }
  function codeCandidate(v){
    if(v==null)return null;
    const s=String(v).trim();
    if(/^\d{1,5}$/.test(s))return Number(s);
    const m=s.match(/(?:LOJA|STORE|COD(?:IGO)?|CODIGO)\s*[-:#]?\s*(\d{1,5})\b/i);
    return m?Number(m[1]):null;
  }
  function bankCode(log){
    const p=payload(log);
    const vals=[log.loja_key,p.lojaKey,p.lojaNome,p.loja,p.nomeLoja,p.codigoLoja,p.codLoja,storeName(log)];
    for(const v of vals){
      if(v==null)continue;
      const raw=String(v).trim();
      // loja_key normalmente vem como "0289 - Itapevi Sp".
      // Pegamos o primeiro bloco numérico e removemos zeros à esquerda.
      const first=raw.match(/^\s*(\d{1,5})\b/);
      if(first)return Number(first[1]);
      const c=codeCandidate(raw);
      if(c!=null)return c;
    }
    return null;
  }
  function bankName(log){return normText(storeName(log));}

  const DAY_LABELS={
    'SEGUNDA-FEIRA':'Segunda','TERÇA-FEIRA':'Terça','QUARTA-FEIRA':'Quarta',
    'QUINTA-FEIRA':'Quinta','SEXTA-FEIRA':'Sexta','SÁBADO':'Sábado','DOMINGO':'Domingo'
  };
  function scaledDays(log){
    if(!log)return [];
    const sched=schedule(log)||{};
    return DAYS.filter(d=>{
      const entries=sched[d]||{};
      return Object.values(entries).some(en=>en && en.escalar==='SIM');
    }).map(d=>DAY_LABELS[d]||d);
  }
  function sortRows(rows,key,dir){
    const mult=dir==='asc'?1:-1;
    const value=(r,k)=>{
      if(k==='coverage')return coverageRate(r);
      if(k==='draft')return r.draft?1:0;
      if(k==='concluded')return r.concluded?1:0;
      if(k==='printed')return r.printed?1:0;
      if(k==='status')return r.concluded?'Concluído':r.draft?'Rascunho':'Não concluído';
      if(k==='days')return scaledDays(r.log).join(', ');
      if(k==='saved')return r.responded?(saved(r.log)||''):'';
      return r[k];
    };
    return rows.slice().sort((a,b)=>{
      let av=value(a,key), bv=value(b,key);
      if(key==='cod'||key==='responded'||key==='pending'||key==='total'||key==='coverage'||key==='draft'||key==='concluded'||key==='printed'){
        av=Number(av)||0;bv=Number(bv)||0;
        return (av-bv)*mult;
      }
      av=String(av??'');bv=String(bv??'');
      return av.localeCompare(bv,'pt-BR',{numeric:true,sensitivity:'base'})*mult;
    });
  }
  function sortHeader(label,key,sortState){
    const active=sortState.key===key;
    const arrow=active?(sortState.dir==='asc'?'↑':'↓'):'↕';
    return (label?label+' ':'')+'<span class="sort-indicator">'+arrow+'</span>';
  }
  function isoDate(v){
    if(!v)return '';
    const m=String(v).match(/^(\d{4}-\d{2}-\d{2})/);
    return m?m[1]:'';
  }
  function responseDate(log){return isoDate(log&& (log.created_at||saved(log)));}
  function addDaysIso(base, n){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(base||'')))return '';
    const d=new Date(base+'T00:00:00');
    if(isNaN(d))return '';
    d.setDate(d.getDate()+Number(n||0));
    return d.toISOString().slice(0,10);
  }
  function scheduledDates(log){
    if(!log)return [];
    const w=week(log);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(w||'')))return [];
    const sched=schedule(log)||{};
    return DAYS.map((d,i)=>{
      const entries=sched[d]||{};
      const has=Object.values(entries).some(en=>en && en.escalar==='SIM');
      return has?addDaysIso(w,i):'';
    }).filter(Boolean);
  }
  function scaleDate(log){
    const ds=scheduledDates(log);
    if(ds.length)return ds[0];
    const w=week(log);
    return /^\d{4}-\d{2}-\d{2}$/.test(String(w||''))?String(w):'';
  }
  function dateInRange(d){
    if(!d)return false;
    if(coverageStartDate && d<coverageStartDate)return false;
    if(coverageEndDate && d>coverageEndDate)return false;
    return true;
  }
  function logMatchesCoverageDate(log){
    if(!coverageStartDate && !coverageEndDate)return true;
    return dateInRange(responseDate(log));
  }
  function coverageRows(){
    const byCode={}, byName={};
    const put=(map,key,l)=>{
      if(key==null||key==='')return;
      const stamp=new Date(saved(l)||l.created_at||0);
      const rank=Object.keys(schedule(l)||{}).length>0?1:0;
      if(!map[key] || rank>(map[key]._rank||0) || (rank===(map[key]._rank||0) && stamp>new Date(saved(map[key])||map[key].created_at||0))){
        l._rank=rank; map[key]=l;
      }
    };
    logs.forEach(l=>{
      if(logMatchesCoverageDate(l)){
        put(byCode,bankCode(l),l);
        put(byName,bankName(l),l);
      }
    });
    logs.forEach(l=>{try{delete l._rank}catch(e){}});
    return RELATION.map(r=>{
      const log=byCode[r.cod] || byName[normText(r.loja)] || null;
      return {...r,responded:!!log,log:log||null};
    });
  }
  function coverageRegionalRows(){
    const rows=coverageRows(), map={};
    rows.forEach(r=>{
      const isDone=isScaleConcluded(r.log);
      const isDraft=!!r.log && !isDone;
      const isPrinted=!!r.log && weekPrintInfo(r.log).printed;
      r.draft=isDraft; r.concluded=isDone; r.printed=isPrinted;
      if(!map[r.regional])map[r.regional]={regional:r.regional,ggl:r.ggl,total:0,draft:0,concluded:0,printed:0,pending:0,rows:[]};
      const x=map[r.regional]; x.ggl=String(r.ggl||''); x.regional=String(r.regional||''); x.total++;
      if(isDraft)x.draft++; if(isDone)x.concluded++; if(isPrinted)x.printed++; if(!isDone)x.pending++; x.rows.push(r);
    });
    return Object.values(map).sort((a,b)=>a.regional.localeCompare(b.regional,'pt-BR'));

  function coverageRate(x){return x.total?Math.round(x.concluded/x.total*1000)/10:0}
  function rateClass(v){return v>=90?'high':v>=70?'mid':'low'}
  function coverageStatusLabel(x){return x.pending===0?'Regional concluída':x.concluded===0?'Nenhuma concluída':'Acompanhamento necessário'}

  function coverageStatusMatch(r){
    if(!coverageStatus)return true;

  function filteredCoverageRegionalRows(){

        const okStatus=coverageStatusMatch(r);

  function smoothPath(points){
    if(!points.length)return '';
    if(points.length===1)return 'M '+points[0][0]+' '+points[0][1];
    let d='M '+points[0][0]+' '+points[0][1];
    for(let i=0;i<points.length-1;i++){
      const p0=points[i-1]||points[i], p1=points[i], p2=points[i+1], p3=points[i+2]||p2;
      const cp1x=p1[0]+(p2[0]-p0[0])/6, cp1y=p1[1]+(p2[1]-p0[1])/6;
      const cp2x=p2[0]-(p3[0]-p1[0])/6, cp2y=p2[1]-(p3[1]-p1[1])/6;
      d+=' C '+cp1x+' '+cp1y+', '+cp2x+' '+cp2y+', '+p2[0]+' '+p2[1];
    }
    return d;
  }

    if(!rows.length)return '<div class="card regional-line-chart"><div class="card-head"><div><h2>📈 Concluídos e participação por Regional</h2><span>Segunda a sábado + pelo menos uma impressão na semana</span></div></div><div class="regional-chart-empty">Nenhuma Regional encontrada para os filtros atuais.</div></div>';
    const W=Math.max(980,rows.length*135), H=430, left=62, right=62, top=42, bottom=92, pw=W-left-right, ph=H-top-bottom;
    const maxCount=Math.max(1,...rows.map(r=>r.concluded));

    const pctLabels=rows.map((r,i)=>'<g class="point-label pct-label"><rect x="'+(x(i)-31)+'" y="'+(yPct(r.participation)+9)+'" width="62" height="20" rx="7"/><text x="'+x(i)+'" y="'+(yPct(r.participation)+23)+'" text-anchor="middle">'+r.participation+'%</text></g>').join('');
    const rankLabels=rows.map((r,i)=>'<text x="'+x(i)+'" y="'+(H-66)+'" text-anchor="middle" class="rank">#'+(i+1)+'</text>').join('');
    const labels=rows.map((r,i)=>'<text x="'+x(i)+'" y="'+(H-46)+'" text-anchor="middle" class="rx">'+esc(r.regional)+'</text><text x="'+x(i)+'" y="'+(H-27)+'" text-anchor="middle" class="rxsub">'+r.concluded+'/'+r.total+' lojas</text>').join('');
    const dots=rows.map((r,i)=>'<circle cx="'+x(i)+'" cy="'+yCount(r.concluded)+'" r="5" class="rdot count"><title>#'+(i+1)+' '+esc(r.regional)+': '+r.concluded+' concluídas</title></circle><circle cx="'+x(i)+'" cy="'+yPct(r.participation)+'" r="5" class="rdot pct"><title>#'+(i+1)+' '+esc(r.regional)+': '+r.participation+'% de participação</title></circle>').join('');
    return '<div class="card regional-line-chart"><div class="card-head"><div><h2>📈 Concluídos e participação por Regional</h2><span>Classificação ordenada pela maior participação • Concluído = escala de segunda a sábado + pelo menos uma impressão na semana</span></div><span class="metric-pill">#1 '+esc(rows[0].regional)+' · '+rows[0].participation+'%</span></div><div class="regional-chart-wrap"><svg class="regional-chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de linhas classificado pela maior participação por Regional"><style>.rgrid{stroke:#e7e5e1;stroke-width:1}.ry{fill:#777b84;font-size:10px;font-family:Barlow,Arial,sans-serif}.rx{fill:#242830;font-size:10px;font-weight:800;font-family:Barlow,Arial,sans-serif}.rxsub{fill:#777b84;font-size:9px;font-family:Barlow,Arial,sans-serif}.rline-count{fill:none;stroke:#4A4E58;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.rline-pct{fill:none;stroke:#9a6900;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.rdot.count{fill:#4A4E58}.rdot.pct{fill:#9a6900}.r-axis{stroke:#cfcac2;stroke-width:1}.r-title{fill:#777b84;font-size:10px;font-weight:700;font-family:Barlow,Arial,sans-serif}.point-label{font-family:Barlow,Arial,sans-serif;font-size:10px;font-weight:800}.count-label rect{fill:#4A4E58}.count-label text{fill:#fff}.pct-label rect{fill:#f6df76;stroke:#9a6900;stroke-width:1}.pct-label text{fill:#4A4E58}.rank{fill:#9a6900;font-size:10px;font-weight:900;font-family:Barlow,Arial,sans-serif}</style><line x1="'+left+'" y1="'+top+'" x2="'+left+'" y2="'+(top+ph)+'" class="r-axis"/><line x1="'+(W-right)+'" y1="'+top+'" x2="'+(W-right)+'" y2="'+(top+ph)+'" class="r-axis"/><line x1="'+left+'" y1="'+(top+ph)+'" x2="'+(W-right)+'" y2="'+(top+ph)+'" class="r-axis"/>'+grid.join('')+'<text x="'+left+'" y="24" class="r-title">Lojas concluídas</text><text x="'+(W-right)+'" y="24" text-anchor="end" class="r-title">Participação</text><path d="'+smoothPath(countPts)+'" class="rline-count"/><path d="'+smoothPath(pctPts)+'" class="rline-pct"/>'+dots+countLabels+pctLabels+rankLabels+labels+'</svg></div><div class="regional-chart-legend"><span><i style="background:#4A4E58"></i>Concluídas</span><span><i style="background:#9a6900"></i>Participação</span><span>🏆 Classificação: maior participação → menor participação</span></div><div class="regional-chart-note">Os rótulos aparecem diretamente nos pontos das linhas. A classificação é baseada na participação de lojas concluídas ÷ total de lojas da Regional.</div></div>';
  }

  function exportCoverageExcel(){
    const rows=filteredCoverageRegionalRows().flatMap(x=>x.rows), regions=filteredCoverageRegionalRows().map(x=>({...x,total:x.rows.length,draft:x.rows.filter(r=>r.draft).length,concluded:x.rows.filter(r=>r.concluded).length,printed:x.rows.filter(r=>r.printed).length}));
    if(typeof XLSX==='undefined'){alert('A biblioteca de exportação do Excel não foi carregada. Verifique a conexão com a internet e tente novamente.');return;}
    const now=new Date(), stamp=now.toLocaleString('pt-BR');
    const summary=regions.map(x=>({GGL:x.ggl,REGIONAL:x.regional,TOTAL_LOJAS:x.total,RASCUNHO:x.draft,CONCLUIDO:x.concluded,IMPRESSO:x.printed,PARTICIPACAO_PERCENTUAL:coverageRate(x)/100}));
    const detailRows=rows.map(r=>({GGL:r.ggl,REGIONAL:r.regional,COD_LOJA:r.cod,LOJA:r.loja,RASCUNHO:r.draft?1:0,CONCLUIDO:r.concluded?1:0,IMPRESSO:r.printed?1:0,STATUS:r.concluded?'Concluído':r.draft?'Rascunho':'Não concluído',DIAS_ESCALADOS:r.log?scaledDays(r.log).join(', '):'',ULTIMA_ATUALIZACAO:r.log?(saved(r.log)||''):'',ID_REGISTRO:r.log?(r.log.id||''):'',ORIGEM:r.log?(payload(r.log).trigger||r.log.trigger||''):''}));
    const wb=XLSX.utils.book_new(), ws1=XLSX.utils.json_to_sheet(summary), ws2=XLSX.utils.json_to_sheet(detailRows);
    const ws3=XLSX.utils.aoa_to_sheet([['RELATÓRIO DE ANÁLISE REGIONAL'],['Gerado em',stamp],['Linha do tempo','Rascunho → Concluído → Impresso'],['Participação','Percentual de lojas com status Concluído sobre o total de lojas'],['Rascunho','Loja com registro de escala, mas ainda sem cumprir todos os critérios de conclusão'],['Concluído','Escala de segunda a sábado e pelo menos uma impressão na mesma semana'],['Impresso','Existe registro de impressão para a mesma loja e semana']]);
    ws1['!cols']=[{wch:8},{wch:18},{wch:13},{wch:12},{wch:13},{wch:12},{wch:20}]; ws2['!cols']=[{wch:8},{wch:16},{wch:12},{wch:32},{wch:11},{wch:12},{wch:11},{wch:18},{wch:30},{wch:22},{wch:18},{wch:18}]; ws3['!cols']=[{wch:28},{wch:85}];
    summary.forEach((r,i)=>{const cell=ws1['G'+(i+2)];if(cell)cell.z='0.0%';});
    XLSX.utils.book_append_sheet(wb,ws1,'RESUMO_REGIONAL'); XLSX.utils.book_append_sheet(wb,ws2,'LOJAS'); XLSX.utils.book_append_sheet(wb,ws3,'LEIA-ME');
    XLSX.writeFile(wb,'Analise_Regional_Escala_DDV_'+now.toISOString().slice(0,10)+'.xlsx');
  }

  const cs=$('coverageStatus');if(cs)cs.onchange=()=>{coverageStatus=cs.value;render()};
  const csearch=$('coverageSearch');if(csearch)csearch.oninput=()=>{coverageSearch=csearch.value;render()};
  const ce=$('exportCoverage');if(ce)ce.onclick=exportCoverageExcel;
  const cc=$('clearCoverage');if(cc)cc.onclick=()=>{coverageRegional='';coverageStatus='';coverageSearch='';coverageStartDate='';coverageEndDate='';coverageOpen=new Set();render()};
  const dd=$('drillDown');if(dd)dd.onclick=()=>{coverageLevel='stores';coverageOpen=new Set();render()};
  const du=$('drillUp');if(du)du.onclick=()=>{coverageLevel='regional';render()};

  document.querySelectorAll('[data-region-toggle]').forEach(row=>row.onclick=e=>{
    if(e.target.closest('[data-store-sort]'))return;

  document.querySelectorAll('.coverage-summary th[data-sort]').forEach(th=>th.onclick=()=>{

  document.querySelectorAll('.store-mini-table th[data-store-sort], .drill-table th[data-store-sort]').forEach(th=>th.onclick=e=>{

  const sideToggle=$('sideToggle');

   PARTÍCULAS INTERATIVAS — LOGIN + DASHBOARD
   ============================================================ */
(function initParticleNetwork(){
  const canvas=document.getElementById('particleCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  if(!ctx)return;

  const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mouse={x:-9999,y:-9999,radius:145,active:false};
  let particles=[];
  let width=0,height=0,dpr=1;
  let raf=0;

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    width=window.innerWidth;
    height=window.innerHeight;
    canvas.width=Math.round(width*dpr);
    canvas.height=Math.round(height*dpr);
    canvas.style.width=width+'px';
    canvas.style.height=height+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const area=Math.max(1,width*height);
    const count=Math.max(38,Math.min(105,Math.floor(area/15500)));
    particles=Array.from({length:count},()=>makeParticle(true));
  }

  function makeParticle(initial){
    const angle=Math.random()*Math.PI*2;
    const speed=.08+Math.random()*.24;
    return {
      x:Math.random()*width,
      y:Math.random()*height,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      r:.75+Math.random()*1.65,
      baseAlpha:.26+Math.random()*.48,
      pulse:Math.random()*Math.PI*2,
      pulseSpeed:.006+Math.random()*.012,
      initial
    };
  }

  function move(p){
    p.pulse+=p.pulseSpeed;
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<-20)p.x=width+20;
    if(p.x>width+20)p.x=-20;
    if(p.y<-20)p.y=height+20;
    if(p.y>height+20)p.y=-20;

    if(mouse.active&&!reduceMotion){
      const dx=p.x-mouse.x,dy=p.y-mouse.y;
      const dist=Math.hypot(dx,dy);
      if(dist<mouse.radius&&dist>0.001){
        const force=(1-dist/mouse.radius)*.34;
        p.vx+=(dx/dist)*force;
        p.vy+=(dy/dist)*force;
      }
    }

    const max=.72;
    const speed=Math.hypot(p.vx,p.vy);
    if(speed>max){p.vx=p.vx/speed*max;p.vy=p.vy/speed*max}
    p.vx*=.997;p.vy*=.997;
  }

  function draw(){
    ctx.clearRect(0,0,width,height);
    /* Bolinhas douradas conectadas por linhas finas quando estão próximas. */
    const linkDist=130;
    for(const p of particles) move(p);
    for(let i=0;i<particles.length;i++){
      const p1=particles[i];
      for(let j=i+1;j<particles.length;j++){
        const p2=particles[j];
        const dx=p1.x-p2.x,dy=p1.y-p2.y;
        const dist=Math.hypot(dx,dy);
        if(dist<linkDist){
          const lineAlpha=(1-dist/linkDist)*.22*((p1.baseAlpha+p2.baseAlpha)/2);
          ctx.beginPath();
          ctx.moveTo(p1.x,p1.y);
          ctx.lineTo(p2.x,p2.y);
          ctx.strokeStyle=`rgba(255,225,75,${lineAlpha})`;
          ctx.lineWidth=1;
          ctx.stroke();
        }
      }
    }
    for(const p of particles){
      const alpha=p.baseAlpha*(.72+.28*Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,225,75,${alpha})`;
      ctx.fill();
    }

    /* Pequeno brilho no entorno do cursor, sem alterar o fundo do HTML. */
    if(mouse.active&&!reduceMotion){
      const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,mouse.radius*.5);
      g.addColorStop(0,'rgba(255,225,75,.045)');
      g.addColorStop(1,'rgba(255,225,75,0)');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.arc(mouse.x,mouse.y,mouse.radius*.5,0,Math.PI*2);
      ctx.fill();
    }

    raf=requestAnimationFrame(draw);
  }

  function pointerMove(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true}
  function pointerLeave(){mouse.active=false;mouse.x=-9999;mouse.y=-9999}
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('pointermove',pointerMove,{passive:true});
  window.addEventListener('pointerout',e=>{if(!e.relatedTarget)pointerLeave()},{passive:true});
  document.addEventListener('mouseleave',pointerLeave,{passive:true});

  resize();
  if(reduceMotion){
    draw();
    cancelAnimationFrame(raf);
  }else{
    draw();
  }
})();
</script>
